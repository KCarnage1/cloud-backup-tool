[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-backup-tool"
version = "1.0.0"
description = "Watch a folder, compress changed files and upload them to a folder or S3-compatible storage, retrying failures."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "moto[s3]>=5", "boto3>=1.34"]

[project.scripts]
backup-tool = "backup_tool.cli:main"

[tool.setuptools]
packages = ["backup_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
